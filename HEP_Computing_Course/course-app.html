<title>HEP Applications — Self-Paced Course</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --accent: #6c63ff;
  --accent2: #00d4aa;
  --accent3: #ff6b6b;
  --text: #e4e4e7;
  --text2: #9ca3af;
  --border: #2d3148;
  --code-bg: #161922;
  --success: #22c55e;
  --warning: #f59e0b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 300px; min-width: 300px; background: var(--surface);
  border-right: 1px solid var(--border); padding: 20px 0;
  overflow-y: auto; position: fixed; top: 0; bottom: 0; z-index: 10;
}
.main { margin-left: 300px; flex: 1; padding: 40px 60px; max-width: 960px; }

/* Sidebar */
.sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.sidebar-header h1 { font-size: 1.1em; color: var(--accent); letter-spacing: 0.5px; }
.sidebar-header .subtitle { font-size: 0.78em; color: var(--text2); margin-top: 4px; }
.progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.5s; }
.progress-label { font-size: 0.72em; color: var(--text2); margin-top: 4px; }

.nav-section { padding: 8px 20px; }
.nav-module {
  font-size: 0.8em; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 6px; cursor: pointer;
  font-size: 0.88em; color: var(--text2); transition: all 0.2s;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item.completed .check { color: var(--success); }
.nav-item .check { width: 18px; font-size: 0.9em; }

/* Content */
h2 { font-size: 1.8em; margin-bottom: 8px; color: #fff; }
h3 { font-size: 1.3em; margin: 28px 0 12px; color: var(--accent2); }
h4 { font-size: 1.05em; margin: 20px 0 8px; color: var(--accent); }
p { margin-bottom: 14px; color: var(--text); }
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.72em; font-weight: 600; margin-right: 6px; }
.tag-cpp { background: #1e3a5f; color: #60a5fa; }
.tag-python { background: #1a3c2a; color: #4ade80; }
.tag-project { background: #3b1f4a; color: #c084fc; }
.tag-quiz { background: #4a2c1a; color: #fb923c; }
.tag-hep { background: #4a1a2e; color: #f472b6; }

.reading-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; margin: 20px 0;
}
.concept-box {
  background: linear-gradient(135deg, rgba(108,99,255,0.08), rgba(0,212,170,0.06));
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; padding: 16px 20px; margin: 16px 0;
}
.hep-context {
  background: linear-gradient(135deg, rgba(244,114,182,0.1), rgba(251,146,60,0.06));
  border-left: 3px solid #f472b6;
  border-radius: 0 8px 8px 0; padding: 16px 20px; margin: 16px 0;
}
.hep-context::before { content: "🔬 sPHENIX Context: "; font-weight: 700; color: #f472b6; }

/* Code blocks */
.code-block {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; margin: 14px 0; overflow: hidden;
}
.code-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border); font-size: 0.78em; color: var(--text2);
}
.code-header button {
  background: none; border: 1px solid var(--border); color: var(--text2);
  padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em;
}
.code-header button:hover { background: var(--surface2); color: var(--text); }
pre { padding: 14px; overflow-x: auto; font-size: 0.88em; line-height: 1.6; }
code { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
.kw { color: #c084fc; } .fn { color: #60a5fa; } .str { color: #4ade80; }
.cm { color: #6b7280; font-style: italic; } .num { color: #fb923c; }
.tp { color: #f472b6; } .op { color: #fbbf24; }

/* Interactive code editor */
.code-editor {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; margin: 14px 0; overflow: hidden;
}
.editor-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: rgba(108,99,255,0.1);
  border-bottom: 1px solid var(--border);
}
.editor-header span { font-size: 0.85em; font-weight: 600; color: var(--accent); }
.run-btn {
  background: var(--accent); color: #fff; border: none;
  padding: 5px 16px; border-radius: 5px; cursor: pointer; font-weight: 600;
  font-size: 0.85em; transition: all 0.2s;
}
.run-btn:hover { background: #5a52e0; }
.editor-textarea {
  width: 100%; min-height: 160px; background: var(--code-bg); color: var(--text);
  border: none; padding: 14px; font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 0.88em; line-height: 1.6; resize: vertical; outline: none;

.output-area {
  border-top: 1px solid var(--border); padding: 12px 14px;
  background: rgba(0,0,0,0.2); font-family: monospace; font-size: 0.85em;
  color: var(--accent2); min-height: 40px; white-space: pre-wrap;
}

/* Quiz */
.quiz-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; margin: 20px 0;
}
.quiz-box h4 { color: var(--warning); margin-top: 0; }
.quiz-option {
  display: block; padding: 10px 14px; margin: 6px 0;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; transition: all 0.2s;

.quiz-option:hover { border-color: var(--accent); }
.quiz-option.correct { border-color: var(--success); background: rgba(34,197,94,0.1); }
.quiz-option.wrong { border-color: var(--accent3); background: rgba(255,107,107,0.1); }
.quiz-feedback { margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 0.9em; display: none; }

/* Project card */
.project-card {
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin: 20px 0; position: relative; overflow: hidden;

.project-card::before {

  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));

.project-card h4 { margin-top: 8px; font-size: 1.15em; color: #fff; }
.project-card .difficulty {

  font-size: 0.72em; font-weight: 700; margin: 8px 0;

.diff-beginner { background: rgba(34,197,94,0.15); color: #4ade80; }
.diff-intermediate { background: rgba(245,158,11,0.15); color: #fbbf24; }
.diff-advanced { background: rgba(255,107,107,0.15); color: #ff6b6b; }

.checklist { list-style: none; margin: 10px 0; }
.checklist li { padding: 4px 0; font-size: 0.9em; }
.checklist li::before { content: '☐ '; color: var(--text2); }
.checklist li.done::before { content: '☑ '; color: var(--success); }

/* Complete button */
.complete-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); padding: 8px 20px; border-radius: 6px;
  cursor: pointer; font-size: 0.88em; margin-top: 24px; transition: all 0.2s;

.complete-btn:hover { border-color: var(--success); color: var(--success); }
.complete-btn.is-complete { background: rgba(34,197,94,0.12); border-color: var(--success); color: var(--success); }

/* Tabs for within-lesson navigation */
.lesson-tabs { display: flex; gap: 4px; margin: 20px 0; flex-wrap: wrap; }
.lesson-tab {
  padding: 6px 16px; border-radius: 6px; cursor: pointer;
  font-size: 0.85em; background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border); transition: all 0.2s;
}
.lesson-tab:hover { color: var(--text); }
.lesson-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.welcome-hero {
  text-align: center; padding: 60px 20px;
}
.welcome-hero h2 { font-size: 2.2em; margin-bottom: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.welcome-hero p { color: var(--text2); font-size: 1.05em; max-width: 600px; margin: 0 auto 20px; }
.module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 30px 0; }
.module-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.2s;
}
.module-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.module-card h4 { color: #fff; margin-bottom: 6px; font-size: 1em; }
.module-card p { font-size: 0.82em; color: var(--text2); margin: 0; }
.module-icon { font-size: 1.8em; margin-bottom: 8px; }

/* Responsive */
@media (max-width: 900px) {
  .sidebar { width: 260px; min-width: 260px; }
  .main { margin-left: 260px; padding: 30px; }
  .module-grid { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
}

.flash-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; margin: 16px 0;
  cursor: pointer; min-height: 100px; display: flex;
  align-items: center; justify-content: center; text-align: center;
  transition: all 0.3s; position: relative;
}
.flash-card:hover { border-color: var(--accent); }
.flash-card .front { font-size: 1em; font-weight: 600; }
.flash-card .back { display: none; font-size: 0.92em; color: var(--accent2); }
.flash-card.flipped .front { display: none; }
.flash-card.flipped .back { display: block; }
.flash-hint { text-align: center; font-size: 0.75em; color: var(--text2); margin-top: -10px; margin-bottom: 16px; }
</style>
</head>

// ===== STATE MANAGEMENT =====
const STATE_KEY = 'hep_course_state';
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
    return { completed: s.completed || {}, current: s.current || 'welcome', notes: s.notes || {} };
  } catch { return { completed: {}, current: 'welcome', notes: {} }; }
}
function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch {}
}
function toggleComplete(lessonId) {
  state.completed[lessonId] = !state.completed[lessonId];
  saveState(); renderNav(); updateProgress();
}
function updateProgress() {
  let total = 0, done = 0;
  COURSE.modules.forEach(m => m.lessons.forEach(l => { total++; if (state.completed[l.id]) done++; }));
  document.getElementById('progressFill').style.width = (total ? (done/total*100) : 0) + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total} lessons completed`;
}

// ===== NAVIGATION =====
function renderNav() {
  const nav = document.getElementById('navSection');
  let html = `<div class="nav-item ${state.current==='welcome'?'active':''}" onclick="navigate('welcome')"><span class="check">🏠</span> Course Home</div>`;
  COURSE.modules.forEach(m => {
    html += `<div class="nav-module">${m.title}</div>`;
    m.lessons.forEach(l => {
      const active = state.current === l.id ? 'active' : '';
      const comp = state.completed[l.id] ? 'completed' : '';
      const icon = state.completed[l.id] ? '✓' : '○';
      html += `<div class="nav-item ${active} ${comp}" onclick="navigate('${l.id}')"><span class="check">${icon}</span> ${l.title}</div>`;
    });
  });
  nav.innerHTML = html;
}

function navigate(id) {
  state.current = id;
  saveState();
  renderNav();
  renderContent(id);
  window.scrollTo(0, 0);
}

// ===== QUIZ ENGINE =====
function checkQuiz(quizId, optionEl, correct, explanation) {
  const box = optionEl.closest('.quiz-box');
  box.querySelectorAll('.quiz-option').forEach(o => {
    o.style.pointerEvents = 'none';
    if (o.dataset.correct === 'true') o.classList.add('correct');
  });
  if (!correct) optionEl.classList.add('wrong');
  const fb = box.querySelector('.quiz-feedback');
  fb.style.display = 'block';
  fb.style.background = correct ? 'rgba(34,197,94,0.12)' : 'rgba(255,107,107,0.12)';
  fb.style.color = correct ? '#4ade80' : '#ff6b6b';
  fb.textContent = (correct ? '✓ Correct! ' : '✗ Not quite. ') + explanation;
}

// ===== FLASH CARDS =====
function flipCard(el) { el.classList.toggle('flipped'); }

// ===== CODE RUNNER (simulated) =====
function runCode(editorId, outputId, simFn) {
  const code = document.getElementById(editorId).value;
  const out = document.getElementById(outputId);
  out.textContent = '▶ Running...\n';
  setTimeout(() => { out.textContent = simFn(code); }, 400);
}

// ===== CONTENT RENDERER =====
function renderContent(id) {
  const main = document.getElementById('mainContent');

  if (!content) { main.innerHTML = '<p>Lesson not found.</p>'; return; }
  if (typeof content === 'function') { main.innerHTML = content(); }
  else { main.innerHTML = content; }
}

<p>C++ is a statically-typed language — every variable has a type known at compile time. Getting comfortable with the type system is the foundation everything else builds on.</p>

<h4>Fundamental Types</h4>
<p><code>int</code> (32-bit integer), <code>double</code> (64-bit floating point — use this for physics calculations, not float), <code>bool</code> (true/false), <code>char</code> (single character), <code>std::string</code> (text). In HEP code, you will also see <code>float</code> (32-bit, often used in ROOT trees to save space), <code>unsigned int</code> (non-negative), and <code>size_t</code> (for array sizes).</p>

<h4>auto Keyword</h4>
<p>Let the compiler deduce the type: <code>auto pt = 3.14;</code> is a <code>double</code>. Use <code>auto</code> when the type is obvious from the right-hand side or long to type. It makes code cleaner without losing type safety.</p>

<h4>Control Flow</h4>
<p><code>if/else</code>, <code>for</code>, <code>while</code>, <code>switch</code> — these work like most C-family languages. The range-based for loop (<code>for (auto& x : container)</code>) is the modern way to iterate.</p>

<div class="reading-box">

<h4>Functions</h4>
<p>Functions encapsulate reusable logic. In HEP code, you will write functions for common operations: computing deltaR between two particles, applying track quality cuts, calculating invariant mass.</p>

<h4>Pass by Value vs Reference</h4>
<p><strong>By value</strong> (<code>void f(int x)</code>): copies the argument. Fine for small types (int, double).</p>
<p><strong>By reference</strong> (<code>void f(vector&lt;Track&gt;&amp; tracks)</code>): passes the original — no copy. Use for large objects like vectors of tracks.</p>
<p><strong>By const reference</strong> (<code>void f(const vector&lt;Track&gt;&amp; tracks)</code>): passes the original but prevents modification. The default for reading large objects.</p>

<h4>Scope & Lifetime</h4>
<p>Variables exist from declaration to the end of their enclosing <code>{}</code> block. This is fundamental — when a variable goes out of scope, its destructor runs. This concept becomes critical when we study RAII and smart pointers later.</p>

<h2>Classes & Object-Oriented Programming</h2>

<div class="reading-box">
<h3>Reading: Modeling Physics with Classes</h3>
<p>A class bundles data (member variables) with the operations on that data (member functions). In HEP, classes model physical objects: a Track has a momentum, a Jet has constituents, a Histogram has bins and entries.</p>

<h4>Access Specifiers</h4>
<p><code>public:</code> accessible from anywhere. <code>private:</code> only accessible from within the class. <code>protected:</code> accessible from the class and its derived classes. Convention: data members are private, methods are public.</p>

<h4>Constructors & Destructors</h4>
<p>The <strong>constructor</strong> initializes the object. The <strong>destructor</strong> (~ClassName) cleans up when the object is destroyed. Use the <em>member initializer list</em> for efficiency: <code>Track(double pt) : m_pt(pt) {}</code></p>

<h4>Inheritance</h4>
<p>Derived classes extend base classes. In HEP frameworks, you often inherit from a base module class: <code>class MyAnalysis : public SubsysReco { ... }</code>. The <code>virtual</code> keyword enables polymorphism — calling the right function based on the actual type at runtime.</p>
</div>

<div class="code-block">
<div class="code-header"><span>C++ — Class modeling a physics track</span></div>
<pre><code><span class="kw">class</span> <span class="tp">Track</span> {

    <span class="kw">int</span> m_nTPCHits;

<span class="kw">public</span>:

    <span class="kw">double</span> <span class="fn">pt</span>()  <span class="kw">const</span> { <span class="kw">return</span> m_pt; }
    <span class="kw">double</span> <span class="fn">eta</span>() <span class="kw">const</span> { <span class="kw">return</span> m_eta; }
    <span class="kw">double</span> <span class="fn">phi</span>() <span class="kw">const</span> { <span class="kw">return</span> m_phi; }

    <span class="cm">// Derived quantity</span>

<p><code>std::unordered_map&lt;K,V&gt;</code> — Hash table. O(1) average lookup. Use for fast channel-to-hit mapping.</p>
<p><code>std::set&lt;T&gt;</code> — Sorted unique elements. Use for tracking which run numbers you have processed.</p>
<p><code>std::array&lt;T,N&gt;</code> — Fixed-size array. Zero overhead vs raw C array. Use when size is known at compile time (e.g., 3D coordinates).</p>
<p><code>std::pair&lt;A,B&gt;</code> / <code>std::tuple&lt;...&gt;</code> — Group values together without defining a struct.</p>

<h4>Common Operations</h4>
<p><code>push_back()</code>, <code>emplace_back()</code>, <code>size()</code>, <code>empty()</code>, <code>begin()/end()</code>, <code>find()</code>, <code>erase()</code>, <code>sort()</code>. Learn these well — they appear in every HEP analysis.</p>

<span class="tag tag-cpp">C++</span>
<h2>Pointers, Arrays & Memory Basics</h2>

<div class="reading-box">
<h3>Reading: Understanding Memory</h3>
<p>Pointers are the most feared topic in C++, but they are essential for HEP code. ROOT uses pointers everywhere. Understanding them now makes the smart pointer lesson (Module 1) much easier.</p>

<h4>What Is a Pointer?</h4>
<p>A pointer stores the <em>memory address</em> of another variable. <code>int* p = &x;</code> means p holds the address where x lives. <code>*p</code> dereferences — gives you the value at that address. <code>-></code> is shorthand for dereferencing and accessing a member: <code>p->pt()</code> is the same as <code>(*p).pt()</code>.</p>

<h4>Stack vs Heap</h4>
<p><strong>Stack:</strong> Automatic storage. Variables declared normally live here. Fast allocation, automatically cleaned up when scope ends. Limited size (~1-8 MB).</p>
<p><strong>Heap:</strong> Dynamic storage. Allocated with <code>new</code>, freed with <code>delete</code>. Unlimited size (limited by RAM). You must manage lifetime manually — or use smart pointers (Module 1).</p>

<h4>Why HEP Code Uses Pointers</h4>
<p>ROOT was designed in the 1990s before smart pointers. Objects on the node tree in Fun4All are accessed via raw pointers. Event data structures are heap-allocated because they are too large for the stack. You will see <code>TH1F*</code>, <code>TTree*</code>, <code>PHCompositeNode*</code> constantly.</p>
</div>

<div class="code-block">
<div class="code-header"><span>C++ — Pointers in ROOT/HEP context</span></div>
<pre><code><span class="cm">// Stack allocation — automatic cleanup</span>
<span class="kw">double</span> pt = <span class="num">3.5</span>;        <span class="cm">// lives on the stack</span>
<span class="kw">double</span>* ptr = &pt;       <span class="cm">// ptr holds address of pt</span>
std::cout << *ptr;       <span class="cm">// dereference: prints 3.5</span>

<span class="cm">// Heap allocation — ROOT style (you WILL see this)</span>
<span class="tp">TH1F</span>* hist = <span class="kw">new</span> <span class="tp">TH1F</span>(<span class="str">"pt"</span>, <span class="str">"pT;pT [GeV/c];Counts"</span>, <span class="num">100</span>, <span class="num">0</span>, <span class="num">50</span>);
hist-><span class="fn">Fill</span>(<span class="num">3.5</span>);         <span class="cm">// -> dereferences pointer and calls Fill</span>
hist-><span class="fn">Draw</span>();            <span class="cm">// ROOT manages this pointer's lifetime</span>

<span class="cm">// nullptr — the "points to nothing" value</span>
<span class="tp">Track</span>* track = <span class="kw">nullptr</span>;
<span class="kw">if</span> (track != <span class="kw">nullptr</span>) { <span class="cm">// always check before dereferencing!</span>
    track-><span class="fn">pt</span>();
}

<span class="cm">// Arrays (C-style — you'll see these in old code)</span>
<span class="kw">double</span> energies[<span class="num">48</span>];    <span class="cm">// fixed array on stack</span>
<span class="cm">// Prefer std::vector or std::array in new code!</span></code></pre>
</div>

<div class="concept-box">
  <strong>Rule of thumb:</strong> In new code, use <code>std::vector</code> instead of C arrays, and smart pointers instead of raw <code>new</code>/<code>delete</code>. But you need to understand raw pointers to read existing HEP code and interface with ROOT.
</div>

<h4>TFile — The ROOT File</h4>
<p>ROOT files (.root) use a custom binary format that stores objects hierarchically (like a filesystem). They support compression, random access, and can hold TTrees, histograms, graphs, and arbitrary C++ objects.</p>

<h4>TH1 — The Histogram</h4>
<p><code>TH1F</code> (float precision), <code>TH1D</code> (double precision). Create with name, title, nbins, xmin, xmax. Fill with <code>Fill(value)</code> or <code>Fill(value, weight)</code>. ROOT handles overflow/underflow bins automatically.</p>

<h4>TTree — The Event Store</h4>
<p>A TTree is a columnar data structure — each "branch" stores one variable across all events. A typical sPHENIX DST tree has hundreds of branches: track pT, hit positions, calorimeter energies. TTrees can store billions of events efficiently.</p>
</div>

<h2>What Is AI/ML? The Big Picture</h2>

<div class="reading-box">
<h3>Reading: AI and ML — Demystified for Physicists</h3>
<p>If you are touching AI and ML for the first time, here is the landscape from a physicist's perspective.</p>

<h4>Artificial Intelligence (AI)</h4>
<p>A broad field of making machines perform tasks that normally require human intelligence. Includes rule-based systems (old AI), machine learning, and deep learning.</p>

<h4>Machine Learning (ML)</h4>
<p>A subset of AI where the machine <em>learns patterns from data</em> rather than being explicitly programmed. You show it examples; it finds the rules. For HEP: instead of writing <code>if E/p > 0.8 and shower_width < 3</code>, you give the ML model thousands of labeled electrons and pions, and it learns the optimal boundary itself.</p>

<h4>Deep Learning (DL)</h4>
<p>ML using neural networks with multiple layers. The "deep" refers to depth (many layers). Powers modern breakthroughs: image recognition, language models, and yes — particle identification and track reconstruction.</p>

<h4>The Three Types of Learning</h4>
<p><strong>Supervised:</strong> Learn from labeled data (this track IS an electron). Most HEP-ML is supervised.</p>
<p><strong>Unsupervised:</strong> Find structure in unlabeled data (clustering events, anomaly detection).</p>
<p><strong>Reinforcement:</strong> Learn by trial and error with rewards. Less common in HEP (used in some trigger optimization).</p>

<h4>Why ML for HEP?</h4>
<p>Physics data is high-dimensional (many variables per event), patterns are complex and nonlinear, and datasets are huge (billions of events). ML excels at exactly these conditions. A well-trained neural network can outperform hand-tuned rectangular cuts by 30-50% in signal efficiency at the same background rejection.</p>
</div>

<div class="concept-box">
  <strong>Key insight for physicists:</strong> ML is not a black box — it is function approximation. A neural network learns a function f(inputs) → output, just like fitting a polynomial to data. The difference: NNs can fit arbitrarily complex functions in high-dimensional spaces where polynomials fail.
</div>

<div class="flash-card" onclick="flipCard(this)">

</div>

<span class="tag tag-cpp">C++</span><span class="tag tag-hep">HEP</span>
<h2>Smart Pointers & RAII</h2>

<div class="reading-box">
<h3>Reading: Ownership in Physics Code</h3>
<p>In HEP software, you are constantly managing complex object lifetimes — detector hits that live inside events, histograms shared across analysis modules, and trees that must persist across processing chains. Raw pointers (<code>new</code>/<code>delete</code>) are the #1 source of memory bugs in legacy physics code.</p>

<p><strong>RAII</strong> (Resource Acquisition Is Initialization) is the C++ idiom where you tie resource lifetime to object scope. When the object goes out of scope, the resource is automatically released. Smart pointers implement RAII for heap-allocated memory.</p>

<h4>The Three Smart Pointers</h4>

<p><code>std::unique_ptr&lt;T&gt;</code> — <em>Exclusive ownership.</em> Exactly one owner. When it goes out of scope, the object is deleted. Cannot be copied, only moved. Use this by default.</p>

<p><code>std::shared_ptr&lt;T&gt;</code> — <em>Shared ownership.</em> Reference-counted. The object lives until the last shared_ptr to it is destroyed. Useful when multiple analysis modules need the same histogram. Has overhead from atomic reference counting.</p>

<p><code>std::weak_ptr&lt;T&gt;</code> — <em>Non-owning observer.</em> Points to a shared_ptr's object without affecting its lifetime. Call <code>.lock()</code> to get a temporary shared_ptr. Breaks circular references.</p>
</div>

<div class="hep-context">
In sPHENIX, the Fun4All framework manages event-level objects. When you write a subsystem module, you typically retrieve detector hits via raw pointers from the node tree. Modern analysis code should wrap local allocations in smart pointers so your module never leaks, even if processing throws an exception midway through an event.
</div>

<div class="code-block">

<pre><code><span class="cm">// BEFORE: Raw pointer — easy to leak on early return</span>

}

    <span class="kw">auto</span> h = std::<span class="fn">make_unique</span>&lt;<span class="tp">TH1F</span>&gt;(<span class="str">"pt"</span>, <span class="str">"p_{T};p_{T} [GeV/c];Counts"</span>, <span class="num">100</span>, <span class="num">0</span>, <span class="num">50</span>);

}

<span class="tag tag-cpp">C++</span>
<h2>Move Semantics & Perfect Forwarding</h2>

<div class="reading-box">
<h3>Reading: Why Moves Matter in Physics</h3>
<p>Consider filling a <code>std::vector</code> with millions of reconstructed tracks, each containing vectors of hit positions. Without move semantics, every reallocation copies every track — an O(n²) disaster. With moves, the vector simply steals the internal pointer from each track, making reallocation O(n).</p>

<p><strong>Lvalue vs Rvalue:</strong> An <em>lvalue</em> has a name and persists (a variable). An <em>rvalue</em> is a temporary about to be destroyed (the result of a function call, a literal). Move semantics let you "steal" resources from rvalues instead of copying them.</p>

<p><strong>The Rule of Five:</strong> If you define any of {destructor, copy constructor, copy assignment, move constructor, move assignment}, you should define all five (or explicitly default/delete them). In modern C++, prefer the Rule of Zero — use smart pointers and containers so the compiler-generated defaults do the right thing.</p>

<h4>std::move and std::forward</h4>
<p><code>std::move(x)</code> is just a cast to rvalue reference — it doesn't move anything. It <em>enables</em> moving by saying "I'm done with x, you may steal its resources."</p>
<p><code>std::forward&lt;T&gt;(x)</code> preserves the value category of a forwarding reference parameter. Used in template code to pass arguments without unnecessary copies.</p>
</div>

<div class="code-block">
<div class="code-header"><span>C++ — Move semantics for detector data</span></div>
<pre><code><span class="kw">class</span> <span class="tp">TrackContainer</span> {
    <span class="tp">std::vector</span>&lt;<span class="tp">RecoTrack</span>&gt; m_tracks;
<span class="kw">public</span>:
    <span class="cm">// Move constructor — steals the vector's internal buffer</span>
    <span class="fn">TrackContainer</span>(<span class="tp">TrackContainer</span><span class="op">&&</span> other) <span class="kw">noexcept</span>
        : m_tracks(std::<span class="fn">move</span>(other.m_tracks)) {}

    <span class="cm">// Efficient insertion — move track in, don't copy</span>
    <span class="kw">void</span> <span class="fn">addTrack</span>(<span class="tp">RecoTrack</span><span class="op">&&</span> track) {
        m_tracks.<span class="fn">emplace_back</span>(std::<span class="fn">move</span>(track));
    }

    <span class="cm">// Perfect forwarding — construct track in-place</span>
    <span class="kw">template</span>&lt;<span class="kw">typename</span>... <span class="tp">Args</span>&gt;
    <span class="kw">void</span> <span class="fn">emplaceTrack</span>(<span class="tp">Args</span><span class="op">&&</span>... args) {
        m_tracks.<span class="fn">emplace_back</span>(std::<span class="fn">forward</span>&lt;<span class="tp">Args</span>&gt;(args)...);
    }
};

<span class="cm">// Usage — zero unnecessary copies</span>
<span class="tp">TrackContainer</span> tracks;
<span class="tp">RecoTrack</span> t = <span class="fn">reconstructTrack</span>(hits);
tracks.<span class="fn">addTrack</span>(std::<span class="fn">move</span>(t));  <span class="cm">// t is moved, now in a "valid but unspecified" state</span>
tracks.<span class="fn">emplaceTrack</span>(eta, phi, pt); <span class="cm">// constructed directly inside the vector</span></code></pre>
</div>

<div class="hep-context">
sPHENIX event processing can involve tens of thousands of tracks per Au+Au collision. The difference between copying and moving track objects through the reconstruction chain has real impact on throughput. The Fun4All subsystem modules pass data between processing steps — understanding move semantics helps you write modules that don't bottleneck on unnecessary copies.
</div>

<h2>Neural Networks from Scratch</h2>

<div class="reading-box">
<h3>Reading: The Neuron — From Biology to Physics Analysis</h3>
<p>A neural network is a function approximator. In HEP, we use them to learn complex decision boundaries that separate signal from background — boundaries that are impossible to express with simple rectangular cuts.</p>

<h4>The Perceptron</h4>
<p>A single neuron computes: <code>output = activation(w·x + b)</code> where <code>w</code> are weights, <code>x</code> are inputs (e.g., track p_T, eta, number of hits), and <code>b</code> is a bias. The activation function introduces nonlinearity.</p>

<h4>Activation Functions</h4>
<p><strong>ReLU:</strong> <code>max(0, x)</code> — simple, fast, avoids vanishing gradients. Default choice for hidden layers.</p>
<p><strong>Sigmoid:</strong> <code>1/(1+e^(-x))</code> — squashes output to [0,1]. Good for binary classification output (signal vs background).</p>
<p><strong>Softmax:</strong> Normalizes outputs to a probability distribution. Use for multi-class (e.g., classifying jet flavor: u, d, s, c, b, g).</p>

<h4>Backpropagation</h4>
<p>The chain rule applied systematically to compute gradients of the loss with respect to every weight in the network. The gradient tells each weight how to change to reduce the loss. This is how the network learns.</p>

<h4>Loss Functions</h4>
<p><strong>Binary Cross-Entropy:</strong> For signal/background classification. Penalizes confident wrong predictions heavily.</p>
<p><strong>MSE:</strong> For regression (e.g., predicting particle energy from calorimeter hits).</p>
</div>

<pre><code><span class="kw">def</span> <span class="fn">train_epoch</span>(model, loader, optimizer, criterion, device):

<h2>Graph Neural Networks for Track Reconstruction</h2>

<div class="reading-box">
<h3>Reading: Why Graphs Are Natural for Tracking</h3>
<p>Track reconstruction is fundamentally a graph problem. Detector hits are nodes, and possible track segments connecting hits are edges. The task: given a "hit graph" with many fake edges (combinatorial noise), identify the true edges that form real particle trajectories.</p>

<h4>From Hits to Graphs</h4>
<p>In the sPHENIX TPC, a charged particle traversing the 48 radial layers produces ~48 hits. With ~500k hits per Au+Au event, there are trillions of possible hit pairs. We build a sparse graph by only connecting hits in adjacent layers within some geometric window (Δφ, Δz).</p>

<h4>Message Passing</h4>
<p>A GNN iteratively updates each node's representation by aggregating information from its neighbors. After several rounds of message passing, each edge has seen enough context to predict whether it belongs to a true track.</p>

<h4>Edge Classification</h4>
<p>The GNN outputs a score for each edge: probability it connects two hits from the same particle. Threshold and connect components to recover full tracks.</p>
</div>

<div class="code-block">
<div class="code-header"><span>Python — GNN for tracking with PyTorch Geometric</span></div>
<pre><code><span class="kw">import</span> torch
<span class="kw">import</span> torch.nn <span class="kw">as</span> nn
<span class="kw">from</span> torch_geometric.nn <span class="kw">import</span> MessagePassing

<span class="kw">class</span> <span class="tp">TrackingGNN</span>(nn.<span class="tp">Module</span>):
    <span class="kw">def</span> <span class="fn">__init__</span>(self, node_dim=<span class="num">3</span>, hidden=<span class="num">64</span>, n_layers=<span class="num">4</span>):
        <span class="fn">super</span>().__init__()
        <span class="cm"># Encode hit features (r, phi, z) to hidden dim</span>
        self.encoder = nn.<span class="fn">Sequential</span>(
            nn.<span class="fn">Linear</span>(node_dim, hidden), nn.<span class="fn">ReLU</span>(),
            nn.<span class="fn">Linear</span>(hidden, hidden)
        )
        <span class="cm"># Message passing layers</span>
        self.mp_layers = nn.<span class="fn">ModuleList</span>([
            <span class="tp">EdgeConvLayer</span>(hidden) <span class="kw">for</span> _ <span class="kw">in</span> <span class="fn">range</span>(n_layers)
        ])
        <span class="cm"># Edge classifier: concatenate two node embeddings → score</span>
        self.edge_classifier = nn.<span class="fn">Sequential</span>(
            nn.<span class="fn">Linear</span>(<span class="num">2</span> * hidden, hidden), nn.<span class="fn">ReLU</span>(),
            nn.<span class="fn">Linear</span>(hidden, <span class="num">1</span>), nn.<span class="fn">Sigmoid</span>()
        )

    <span class="kw">def</span> <span class="fn">forward</span>(self, x, edge_index):
        <span class="cm"># x: [N_hits, 3], edge_index: [2, N_edges]</span>
        h = self.<span class="fn">encoder</span>(x)
        <span class="kw">for</span> layer <span class="kw">in</span> self.mp_layers:
            h = h + <span class="fn">layer</span>(h, edge_index)  <span class="cm"># residual</span>

        <span class="cm"># Classify each edge</span>
        src, dst = edge_index
        edge_features = torch.<span class="fn">cat</span>([h[src], h[dst]], dim=<span class="num">1</span>)
        <span class="kw">return</span> self.<span class="fn">edge_classifier</span>(edge_features)</code></pre>

<h2>Autoencoders & Anomaly Detection</h2>

<div class="reading-box">
<h3>Reading: Finding the Unexpected</h3>
<p>An autoencoder learns to compress data into a low-dimensional latent space and then reconstruct it. Trained on "normal" data (known SM processes), it will reconstruct those well but fail on anomalous events (new physics). The reconstruction error becomes an anomaly score.</p>

<h4>Architecture</h4>
<p><strong>Encoder:</strong> Maps input x to a compressed latent representation z. For HEP, the input could be jet substructure variables, event-level kinematic distributions, or even raw detector images.</p>
<p><strong>Decoder:</strong> Maps z back to reconstructed input x̂. The bottleneck forces the network to learn the most important features of normal data.</p>

<h4>Variational Autoencoders (VAE)</h4>
<p>The latent space is regularized to follow a Gaussian distribution. This gives smoother anomaly scores and allows sampling — generating synthetic "normal" events for background estimation.</p>

<h4>Applications in HEP</h4>
<p>Anomaly detection for new physics searches (model-independent), data quality monitoring (detecting bad detector runs), and compression for data storage.</p>
</div>

<div class="code-block">
<div class="code-header"><span>Python — VAE for anomaly detection</span></div>
<pre><code><span class="kw">class</span> <span class="tp">PhysicsVAE</span>(nn.<span class="tp">Module</span>):
    <span class="kw">def</span> <span class="fn">__init__</span>(self, input_dim=<span class="num">20</span>, latent_dim=<span class="num">4</span>):
        <span class="fn">super</span>().__init__()
        <span class="cm"># Encoder</span>
        self.encoder = nn.<span class="fn">Sequential</span>(
            nn.<span class="fn">Linear</span>(input_dim, <span class="num">64</span>), nn.<span class="fn">ReLU</span>(),
            nn.<span class="fn">Linear</span>(<span class="num">64</span>, <span class="num">32</span>), nn.<span class="fn">ReLU</span>(),
        )
        self.mu = nn.<span class="fn">Linear</span>(<span class="num">32</span>, latent_dim)
        self.logvar = nn.<span class="fn">Linear</span>(<span class="num">32</span>, latent_dim)
        <span class="cm"># Decoder</span>
        self.decoder = nn.<span class="fn">Sequential</span>(
            nn.<span class="fn">Linear</span>(latent_dim, <span class="num">32</span>), nn.<span class="fn">ReLU</span>(),
            nn.<span class="fn">Linear</span>(<span class="num">32</span>, <span class="num">64</span>), nn.<span class="fn">ReLU</span>(),
            nn.<span class="fn">Linear</span>(<span class="num">64</span>, input_dim),
        )

    <span class="kw">def</span> <span class="fn">reparameterize</span>(self, mu, logvar):
        std = torch.<span class="fn">exp</span>(<span class="num">0.5</span> * logvar)
        eps = torch.<span class="fn">randn_like</span>(std)
        <span class="kw">return</span> mu + eps * std

    <span class="kw">def</span> <span class="fn">forward</span>(self, x):
        h = self.<span class="fn">encoder</span>(x)
        mu, logvar = self.<span class="fn">mu</span>(h), self.<span class="fn">logvar</span>(h)
        z = self.<span class="fn">reparameterize</span>(mu, logvar)
        <span class="kw">return</span> self.<span class="fn">decoder</span>(z), mu, logvar

<span class="cm"># Anomaly score = reconstruction error + KL divergence</span>
<span class="kw">def</span> <span class="fn">anomaly_score</span>(model, x):
    x_recon, mu, logvar = <span class="fn">model</span>(x)
    recon_err = ((x - x_recon) ** <span class="num">2</span>).<span class="fn">sum</span>(dim=<span class="num">1</span>)
    kl = -<span class="num">0.5</span> * (1 + logvar - mu**<span class="num">2</span> - logvar.<span class="fn">exp</span>()).<span class="fn">sum</span>(dim=<span class="num">1</span>)
    <span class="kw">return</span> recon_err + kl</code></pre>

<h3>Reading: Encoding Physics Laws into the Loss Function</h3>
<p>Standard neural networks treat physics data as arbitrary numbers. PINNs embed known physics constraints directly into the training process — conservation laws, symmetries, and differential equations become part of the loss function.</p>

<h4>Why PINNs for HEP?</h4>
<p>A network predicting particle momenta should respect 4-momentum conservation. A detector simulation surrogate should obey electromagnetic shower equations. By encoding these constraints, PINNs need less training data and generalize better to unseen physics.</p>

<p><strong>Hard constraints:</strong> Built into the architecture. E.g., a network that outputs (px, py) and computes pt = sqrt(px²+py²) rather than predicting pt directly.</p>
<p><strong>Soft constraints:</strong> Added as penalty terms in the loss. E.g., penalize violations of energy conservation.</p>
<p><strong>Symmetry-aware architectures:</strong> Equivariant networks that respect rotational symmetry, Lorentz invariance, or permutation invariance (jet constituents have no natural ordering).</p>

<p>A normalizing flow is a sequence of invertible, differentiable transformations. Starting from z ~ N(0,1), apply f₁ ∘ f₂ ∘ ... ∘ fₖ to get samples from a complex distribution. The key: because each step is invertible, you can compute exact likelihoods using the change-of-variables formula.</p>

<h2>Transformer Architecture Deep Dive</h2>

<div class="reading-box">
<h3>Reading: Attention Is All You Need — For Physics Too</h3>

<h4>Self-Attention</h4>
<p>The core insight: instead of processing sequences position-by-position (like RNNs), let every element attend to every other element simultaneously. For a set of jet constituents, this means each particle can "see" all others to determine what's important — no fixed ordering needed.</p>

<p><strong>Mechanism:</strong> Each input token is projected into three vectors: Query (Q), Key (K), and Value (V). Attention scores are computed as softmax(QK^T / √d_k) · V. The scaling by √d_k prevents the dot products from growing too large.</p>

<h4>Multi-Head Attention</h4>
<p>Run multiple attention operations in parallel with different learned projections. One head might attend to spatial proximity, another to energy similarity, another to charge correlations.</p>

<h4>Positional Encoding</h4>
<p>Self-attention is permutation invariant — it doesn't know the order of inputs. For sequences (text), add positional encodings. For particle physics, this is actually a <em>feature</em> — jet constituents have no natural ordering, so permutation invariance is physically correct.</p>

<h4>The Full Transformer Block</h4>
<p>Multi-head attention → Add & LayerNorm → Feed-forward network → Add & LayerNorm. Stack N of these blocks. The residual connections and layer normalization enable training very deep networks.</p>
</div>

<div class="code-block">
<div class="code-header"><span>Python — Transformer for jet physics (Particle Transformer)</span></div>
<pre><code><span class="kw">class</span> <span class="tp">ParticleTransformer</span>(nn.<span class="tp">Module</span>):
    <span class="str">"""Transformer for jet classification from constituents.
    No positional encoding needed — constituents are unordered."""</span>

    <span class="kw">def</span> <span class="fn">__init__</span>(self, feat_dim=<span class="num">7</span>, d_model=<span class="num">128</span>, nhead=<span class="num">8</span>,
                 n_layers=<span class="num">6</span>, n_classes=<span class="num">5</span>):
        <span class="fn">super</span>().__init__()
        self.embed = nn.<span class="fn">Linear</span>(feat_dim, d_model)
        encoder_layer = nn.<span class="fn">TransformerEncoderLayer</span>(
            d_model=d_model, nhead=nhead,
            dim_feedforward=<span class="num">4</span>*d_model, dropout=<span class="num">0.1</span>,
            activation=<span class="str">'gelu'</span>, batch_first=<span class="kw">True</span>
        )
        self.transformer = nn.<span class="fn">TransformerEncoder</span>(
            encoder_layer, num_layers=n_layers

        self.classifier = nn.<span class="fn">Sequential</span>(
            nn.<span class="fn">Linear</span>(d_model, d_model),
            nn.<span class="fn">GELU</span>(),
            nn.<span class="fn">Linear</span>(d_model, n_classes)

<h2>How LLMs Are Built</h2>

<div class="reading-box">
<h3>Reading: From Raw Text to Intelligence</h3>
<p>Understanding how LLMs are built gives you the intuition to use them effectively and know their limitations. The process has three major stages.</p>

<h4>Stage 1: Tokenization</h4>
<p><strong>Byte Pair Encoding (BPE):</strong> Text is split into subword tokens. "calorimeter" might become ["cal", "or", "imeter"]. The tokenizer is trained on a corpus to find the most efficient encoding. Physics jargon often splits into more tokens than common English words — this is why domain-specific fine-tuning helps.</p>
<p>A typical vocabulary has 32k-100k tokens. Each token maps to an integer ID. The entire prompt becomes a sequence of IDs fed to the model.</p>

<h4>Stage 2: Pretraining</h4>
<p><strong>Next-token prediction:</strong> The model reads a sequence of tokens and predicts the next one. Trained on trillions of tokens from the internet, books, code, and scientific papers. The loss function is cross-entropy between the predicted and actual next token.</p>
<p><strong>Scale matters:</strong> Modern LLMs have 7B-400B+ parameters. Training requires thousands of GPUs for weeks. The resulting model has "learned" patterns in language, reasoning, code, and factual knowledge — but it has no explicit knowledge database.</p>

<h4>Stage 3: Alignment (RLHF/DPO)</h4>
<p><strong>Supervised Fine-Tuning (SFT):</strong> The pretrained model is fine-tuned on high-quality instruction-response pairs to follow instructions.</p>
<p><strong>RLHF:</strong> A reward model is trained on human preferences (which response is better?). The LLM is then optimized to maximize the reward while staying close to the SFT model (PPO algorithm).</p>
<p><strong>DPO (Direct Preference Optimization):</strong> A simpler alternative — directly optimize the model on preference pairs without a separate reward model. Used by many modern models.</p>
</div>

<div class="code-block">
<div class="code-header"><span>Python — Mini-LLM training loop (conceptual)</span></div>
<pre><code><span class="cm"># Simplified pretraining loop — the core of how every LLM is built</span>
<span class="kw">import</span> torch
<span class="kw">import</span> torch.nn <span class="kw">as</span> nn

<span class="kw">class</span> <span class="tp">MiniTransformer</span>(nn.<span class="tp">Module</span>):
    <span class="kw">def</span> <span class="fn">__init__</span>(self, vocab_size, d_model=<span class="num">256</span>, nhead=<span class="num">8</span>, n_layers=<span class="num">4</span>):
        <span class="fn">super</span>().__init__()
        self.embed = nn.<span class="fn">Embedding</span>(vocab_size, d_model)
        self.pos_embed = nn.<span class="fn">Embedding</span>(<span class="num">512</span>, d_model)
        layer = nn.<span class="fn">TransformerEncoderLayer</span>(d_model, nhead, <span class="num">4</span>*d_model,
                                              batch_first=<span class="kw">True</span>)
        self.transformer = nn.<span class="fn">TransformerEncoder</span>(layer, n_layers)
        self.head = nn.<span class="fn">Linear</span>(d_model, vocab_size)

    <span class="kw">def</span> <span class="fn">forward</span>(self, x):
        pos = torch.<span class="fn">arange</span>(x.<span class="fn">size</span>(<span class="num">1</span>), device=x.device)
        h = self.<span class="fn">embed</span>(x) + self.<span class="fn">pos_embed</span>(pos)
        <span class="cm"># Causal mask: each token can only attend to previous tokens</span>
        mask = nn.Transformer.<span class="fn">generate_square_subsequent_mask</span>(x.<span class="fn">size</span>(<span class="num">1</span>))

<span class="cm"># Pretraining: predict next token</span>
model = <span class="fn">MiniTransformer</span>(vocab_size=<span class="num">32000</span>)

<h2>Building AI Agents</h2>

<div class="reading-box">
<h3>Reading: From Chatbot to Autonomous Agent</h3>
<p>An AI agent is an LLM that can take actions — call functions, read files, run code, search the web — and reason about the results in a loop until a task is complete. This is the leap from "answer my question" to "do this task for me."</p>

<h4>Agent Architecture</h4>
<p>Every agent has four components:</p>
<p><strong>1. LLM (Brain):</strong> The reasoning engine. Claude, GPT-4, etc. It decides what to do next based on the current state.</p>
<p><strong>2. Tools:</strong> Functions the agent can call. Examples for HEP: run ROOT macro, query database, read detector logs, submit grid jobs, plot histograms.</p>
<p><strong>3. Memory:</strong> Short-term (conversation context) and long-term (vector store of past analyses, notes). Allows the agent to build on previous work.</p>
<p><strong>4. Reasoning Loop:</strong> The pattern of thinking → acting → observing → thinking again. The agent keeps going until the task is done or it gets stuck.</p>

<h4>The ReAct Pattern</h4>
<p><strong>Re</strong>asoning + <strong>Act</strong>ing. The agent alternates between thinking ("I need to find the efficiency for this pT bin") and acting (calling a tool to compute it). This is the most common agent pattern.</p>

<h4>Tool Use / Function Calling</h4>
<p>Modern LLMs support structured tool calling. You define tools with names, descriptions, and parameter schemas. The LLM decides when to call which tool with what arguments. The result is fed back to the LLM for the next reasoning step.</p>

<p>MCP is a standard for connecting AI agents to external tools and data sources. Instead of hardcoding tool functions, MCP lets you plug in standardized servers that expose tools. An MCP server for ROOT could expose "read_tree", "fill_histogram", "fit_peak" as tools any MCP-compatible agent can use.</p>

<h4>LangChain / LangGraph</h4>
<p><strong>LangChain:</strong> A framework for building LLM applications with chains of components (prompt → LLM → parser → tool → LLM). Good for linear pipelines.</p>

<h2>Trigger Systems & Streaming DAQ</h2>

<div class="reading-box">
<h3>Reading: Real-Time Decisions at Collision Speed</h3>
<p>sPHENIX collisions happen every 106 ns (RHIC crossing rate ~9.4 MHz). The data rate from all detectors is ~15 TB/s raw. You cannot store everything — a trigger system must decide in microseconds which events to keep.</p>

<h4>Traditional Trigger Architecture</h4>
<p><strong>Level-1 (hardware):</strong> Custom electronics (FPGAs) make decisions in ~microseconds. Simple thresholds: "Is there a high-energy tower in the EMCal?" Reduces rate by ~100x.</p>
<p><strong>Level-2/HLT (software):</strong> Farm of CPUs/GPUs runs fast reconstruction. More sophisticated: "Is there a track pointing at that EMCal cluster with E/p > 0.8?" Reduces rate by another ~10-100x.</p>

<h4>sPHENIX Streaming Readout</h4>
<p>sPHENIX pioneered a triggerless streaming readout for many of its detectors. Instead of waiting for a trigger decision, the TPC, INTT, and MVTX continuously stream all data. A software-based filter runs downstream to select interesting time windows. This requires massive I/O bandwidth and fast online processing — a perfect use case for ML on edge devices.</p>

<h4>Why ML at the Trigger Level?</h4>
<p>Traditional triggers use rectangular cuts (pT > 2 GeV AND E/p > 0.8). An ML model can learn complex, nonlinear boundaries that achieve the same signal efficiency with much better background rejection — capturing more physics per recorded byte.</p>
</div>

<div class="hep-context">
The sPHENIX streaming readout generates ~100 GB/s of data from the TPC alone. Online processing must reduce this to storable rates (~10 GB/s) while keeping all interesting physics. ML-based triggers running on FPGAs can identify rare probes (J/ψ, Υ, jets, direct photons) in real time with better efficiency than cut-based triggers.
</div>

<p><strong>1. Train in PyTorch/Keras:</strong> Design and train your model normally.</p>

<p><strong>3. Convert with hls4ml:</strong> Translate the model to HLS C++ code optimized for FPGA synthesis.</p>
<p><strong>4. Synthesize:</strong> Compile the HLS code into actual FPGA bitstream using Vivado.</p>

<h4>Design Constraints</h4>
<p><strong>Latency:</strong> Must complete inference within the trigger window (~1 μs for L1). Small, shallow networks.</p>
<p><strong>Resources:</strong> FPGA has limited DSP slices, LUTs, and block RAM. Quantization and pruning reduce resource usage.</p>

<div class="reading-box">
<h3>Reading: Making Models Small Enough for Real-Time</h3>

<h4>Pruning</h4>
<p>Remove weights that are close to zero. A pruned network is sparser but (nearly) as accurate. Structured pruning removes entire neurons/channels; unstructured pruning zeros individual weights.</p>

<h4>Quantization</h4>
<p><strong>Post-training quantization:</strong> Convert float32 → int8 after training. Simple, ~2-4x speedup, minimal accuracy loss for most HEP models.</p>
<p><strong>Quantization-aware training (QAT):</strong> Simulate quantization during training so the model adapts. Better accuracy than post-training, especially at very low precision (4-bit).</p>

<h4>Knowledge Distillation</h4>
<p>Train a small "student" network to mimic a large "teacher" network. The teacher's soft probability outputs contain more information than hard labels — the student learns inter-class relationships. E.g., a large jet classifier teaches a tiny trigger-level classifier.</p>
</div>

<h2>JAX & Differentiable Physics</h2>

<div class="reading-box">
<h3>Reading: When Your Entire Simulation Is Differentiable</h3>
<p><strong>JAX</strong> is Google's library for high-performance numerical computing with automatic differentiation. It combines NumPy's API with the ability to differentiate through arbitrary Python code and compile it to GPU/TPU.</p>

<h4>Why JAX for Physics?</h4>
<p><strong>Differentiable simulation:</strong> Write a detector simulation in JAX and automatically compute gradients through it. This enables gradient-based optimization of detector design, calibration parameters, and analysis cuts.</p>
<p><strong>jit compilation:</strong> <code>@jax.jit</code> compiles your function to XLA (hardware-optimized code). A physics calculation that takes 100ms in NumPy might take 1ms in JIT-compiled JAX.</p>
<p><strong>vmap (auto-batching):</strong> Write code for a single event, then <code>jax.vmap</code> automatically vectorizes it across a batch. No manual batching code needed.</p>

<h4>Key JAX Transforms</h4>
<p><code>jax.grad</code> — compute gradients of any function</p>
<p><code>jax.jit</code> — JIT compile for speed</p>
<p><code>jax.vmap</code> — auto-vectorize across a batch dimension</p>
<p><code>jax.pmap</code> — auto-parallelize across multiple devices</p>
</div>

<div class="code-block">
<div class="code-header"><span>Python — Differentiable physics with JAX</span></div>
<pre><code><span class="kw">import</span> jax
<span class="kw">import</span> jax.numpy <span class="kw">as</span> jnp

<span class="cm"># Differentiable invariant mass calculation</span>
<span class="kw">@jax.jit</span>
<span class="kw">def</span> <span class="fn">invariant_mass</span>(pt1, eta1, phi1, pt2, eta2, phi2):
    <span class="str">"""Compute invariant mass of two massless particles."""</span>
    px1, py1, pz1 = pt1*jnp.<span class="fn">cos</span>(phi1), pt1*jnp.<span class="fn">sin</span>(phi1), pt1*jnp.<span class="fn">sinh</span>(eta1)
    px2, py2, pz2 = pt2*jnp.<span class="fn">cos</span>(phi2), pt2*jnp.<span class="fn">sin</span>(phi2), pt2*jnp.<span class="fn">sinh</span>(eta2)
    E1 = jnp.<span class="fn">sqrt</span>(px1**<span class="num">2</span> + py1**<span class="num">2</span> + pz1**<span class="num">2</span>)
    E2 = jnp.<span class="fn">sqrt</span>(px2**<span class="num">2</span> + py2**<span class="num">2</span> + pz2**<span class="num">2</span>)
    m2 = (E1+E2)**<span class="num">2</span> - (px1+px2)**<span class="num">2</span> - (py1+py2)**<span class="num">2</span> - (pz1+pz2)**<span class="num">2</span>
    <span class="kw">return</span> jnp.<span class="fn">sqrt</span>(jnp.<span class="fn">maximum</span>(m2, <span class="num">0.0</span>))

<span class="cm"># Gradient: how does mass change with each track's pt?</span>
grad_mass = jax.<span class="fn">grad</span>(invariant_mass, argnums=(<span class="num">0</span>, <span class="num">3</span>))
dm_dpt1, dm_dpt2 = <span class="fn">grad_mass</span>(<span class="num">3.0</span>, <span class="num">0.5</span>, <span class="num">1.2</span>, <span class="num">2.5</span>, -<span class="num">0.3</span>, <span class="num">2.8</span>)

<span class="cm"># Auto-batch: compute mass for 10000 pairs at once</span>
batched_mass = jax.<span class="fn">vmap</span>(invariant_mass)
masses = <span class="fn">batched_mass</span>(pt1_array, eta1_array, phi1_array,
                       pt2_array, eta2_array, phi2_array)</code></pre>

<h2>Monte Carlo Simulation in HEP</h2>

<div class="concept-box">
  <strong>Why simulate?</strong> In HEP, we can never fully instrument every cubic millimeter of space around the collision point. Monte Carlo simulation lets us model what happens when particles traverse our detectors so we can understand acceptance, efficiency, resolution, and backgrounds. At sPHENIX, simulation is essential for extracting physics from Au+Au collisions at RHIC.
</div>

<h3>The Simulation Chain in HEP</h3>
<p>Every HEP analysis depends on a simulation chain with distinct stages:</p>

<div class="reading-box">
  <strong>The HEP Simulation Pipeline:</strong><br><br>
  <strong>1. Event Generation</strong> — Produce the initial particles from a collision<br>
  &nbsp;&nbsp;&nbsp;• <strong>PYTHIA</strong>: p+p collisions, parton showers, hadronization<br>
  &nbsp;&nbsp;&nbsp;• <strong>HIJING</strong>: Heavy-ion (Au+Au) collisions with nuclear effects<br>
  &nbsp;&nbsp;&nbsp;• Other generators: HERWIG, Sherpa, EPOS, AMPT, UrQMD<br><br>
  <strong>2. Detector Simulation</strong> — Transport particles through detector material<br>
  &nbsp;&nbsp;&nbsp;• <strong>Geant4</strong>: Full simulation of particle-matter interactions<br>
  &nbsp;&nbsp;&nbsp;• Models electromagnetic showers, hadronic cascades, decays<br><br>
  <strong>3. Digitization</strong> — Convert energy deposits to detector signals<br>
  &nbsp;&nbsp;&nbsp;• ADC counts, timing, dead channels, noise<br><br>
  <strong>4. Reconstruction</strong> — Same algorithms as real data<br>
  &nbsp;&nbsp;&nbsp;• Track finding, clustering, jet reconstruction<br><br>
  <strong>5. Analysis</strong> — Compare MC truth to reconstructed quantities
</div>

<h3>Monte Carlo Methods</h3>
<p>Monte Carlo methods use random sampling to solve problems. In HEP simulation, random numbers decide:</p>
<ul class="checklist">
  <li>What particles emerge from the collision (event generation)</li>
  <li>Where each particle interacts with detector material</li>
  <li>What type of interaction occurs (ionization, bremsstrahlung, pair production, nuclear interaction)</li>
  <li>The kinematics of secondary particles produced</li>
</ul>

<h3>Why sPHENIX Needs Massive Simulation</h3>
<p>Au+Au collisions at sqrt(s_NN) = 200 GeV produce thousands of particles per event. The sPHENIX detector must handle:</p>

<div class="code-block"><pre>
// Typical sPHENIX event multiplicities
// Central Au+Au collision (0-10% centrality):
//   ~5000 charged particles in |eta| < 1.1
//   ~1500 tracks reconstructed by TPC + silicon
//   ~200 GeV deposited in EMCal
//   ~150 GeV deposited in inner HCal
//   ~100 GeV deposited in outer HCal
//
// Simulation campaigns: millions of events
// Storage: ~1 MB/event for full sim

#include "G4RunManagerFactory.hh"

#include "FTFP_BERT.hh"  // A standard physics list

#include "MyDetectorConstruction.hh"
#include "MyPrimaryGeneratorAction.hh"
#include "MyRunAction.hh"
#include "MyEventAction.hh"

int main(int argc, char** argv)
{

  auto* runManager =
    G4RunManagerFactory::CreateRunManager(
      G4RunManagerType::Default);

  // Set mandatory classes
  runManager->SetUserInitialization(
    new MyDetectorConstruction());
  runManager->SetUserInitialization(
    new FTFP_BERT());  // Physics list
  runManager->SetUserAction(
    new MyPrimaryGeneratorAction());

  // Optional: user actions for scoring
  runManager->SetUserAction(new MyRunAction());
  runManager->SetUserAction(new MyEventAction());

  // Initialize the kernel

<h2>Detector Geometry & Materials</h2>

<div class="concept-box">
  <strong>Key Idea:</strong> In Geant4, you build your detector as a hierarchy of volumes: a world volume contains daughter volumes, each with a shape, material, and position. Getting the geometry right is critical — it determines how particles interact with your detector.
</div>

<h3>Geant4 Volume Hierarchy</h3>
<div class="reading-box">
  <strong>Three types of volumes:</strong><br><br>
  <strong>G4Solid</strong> — The shape (box, tube, sphere, trapezoid, etc.)<br>
  <strong>G4LogicalVolume</strong> — Shape + material + optional fields/limits<br>
  <strong>G4VPhysicalVolume</strong> — Logical volume placed in space (inside a mother volume)
</div>

<h3>Building sPHENIX-like Detector Geometry</h3>
<div class="code-block"><pre>
// MyDetectorConstruction.cc
// Simplified sPHENIX-like barrel detector

#include "G4Box.hh"
#include "G4Tubs.hh"
#include "G4LogicalVolume.hh"
#include "G4PVPlacement.hh"
#include "G4NistManager.hh"
#include "G4SystemOfUnits.hh"

G4VPhysicalVolume*
MyDetectorConstruction::Construct()
{
  // Get NIST material manager
  auto* nist = G4NistManager::Instance();

  // --- World volume ---
  auto* worldMat = nist->FindOrBuildMaterial("G4_AIR");
  auto* worldSolid =
    new G4Box("World", 5.*m, 5.*m, 5.*m);
  auto* worldLog =
    new G4LogicalVolume(worldSolid, worldMat, "World");
  auto* worldPhys = new G4PVPlacement(
    nullptr, {}, worldLog, "World",
    nullptr, false, 0, true);

  // --- Beam pipe (beryllium) ---
  auto* bePipe = nist->FindOrBuildMaterial("G4_Be");
  auto* pipeSolid =
    new G4Tubs("BeamPipe",
      2.0*cm, 2.1*cm,  // inner, outer radius
      200.*cm,          // half-length
      0., 360.*deg);
  auto* pipeLog =
    new G4LogicalVolume(pipeSolid, bePipe, "BeamPipe");
  new G4PVPlacement(
    nullptr, {}, pipeLog, "BeamPipe",
    worldLog, false, 0, true);

  // --- MVTX: 3 layers of silicon pixels ---
  auto* silicon = nist->FindOrBuildMaterial("G4_Si");
  double mvtxRadii[] = {2.5*cm, 3.3*cm, 4.1*cm};
  for (int i = 0; i < 3; i++) {
    auto* mvtxSolid = new G4Tubs(
      "MVTX_L" + std::to_string(i),
      mvtxRadii[i], mvtxRadii[i] + 50.*um,
      27.*cm, 0., 360.*deg);
    auto* mvtxLog = new G4LogicalVolume(
      mvtxSolid, silicon,
      "MVTX_L" + std::to_string(i));
    new G4PVPlacement(
      nullptr, {}, mvtxLog,
      "MVTX_L" + std::to_string(i),
      worldLog, false, 0, true);
  }

  // --- TPC (gas volume) ---
  auto* tpcGas = nist->FindOrBuildMaterial("G4_Ar");
  auto* tpcSolid = new G4Tubs(
    "TPC", 20.*cm, 78.*cm,  // inner/outer radius
    105.*cm,                 // half-length
    0., 360.*deg);
  auto* tpcLog =
    new G4LogicalVolume(tpcSolid, tpcGas, "TPC");
  new G4PVPlacement(
    nullptr, {}, tpcLog, "TPC",
    worldLog, false, 0, true);

  // --- EMCal (tungsten-scintillator) ---
  auto* emcalMat =
    nist->FindOrBuildMaterial("G4_W");
  auto* emcalSolid = new G4Tubs(
    "EMCal", 90.*cm, 116.*cm,
    110.*cm, 0., 360.*deg);
  auto* emcalLog =
    new G4LogicalVolume(emcalSolid, emcalMat, "EMCal");
  new G4PVPlacement(
    nullptr, {}, emcalLog, "EMCal",
    worldLog, false, 0, true);

  // --- HCal Inner (steel + scintillator) ---
  auto* steel =
    nist->FindOrBuildMaterial("G4_STAINLESS-STEEL");
  auto* hcalInSolid = new G4Tubs(
    "HCalIn", 116.*cm, 137.*cm,
    110.*cm, 0., 360.*deg);
  auto* hcalInLog =
    new G4LogicalVolume(hcalInSolid, steel, "HCalIn");
  new G4PVPlacement(
    nullptr, {}, hcalInLog, "HCalIn",
    worldLog, false, 0, true);

  // --- HCal Outer (steel + scintillator) ---
  auto* hcalOutSolid = new G4Tubs(
    "HCalOut", 183.*cm, 269.*cm,
    110.*cm, 0., 360.*deg);
  auto* hcalOutLog =
    new G4LogicalVolume(hcalOutSolid, steel, "HCalOut");
  new G4PVPlacement(
    nullptr, {}, hcalOutLog, "HCalOut",
    worldLog, false, 0, true);

  return worldPhys;
}</pre></div>

<h2>Event Generators: PYTHIA</h2>

<div class="concept-box">
  <strong>PYTHIA</strong> is the most widely used general-purpose Monte Carlo event generator in particle physics. It simulates proton-proton, proton-nucleus, and electron-positron collisions, handling everything from the hard scattering through parton showers, hadronization, and particle decays. At sPHENIX, PYTHIA provides the p+p baseline needed for calculating nuclear modification factors like R_AA.
</div>

<h3>What PYTHIA Does</h3>
<div class="reading-box">
  <strong>PYTHIA simulation stages:</strong><br><br>
  <strong>1. Hard Process</strong> — The initial parton-level scattering (qq̄ → gg, qg → qg, etc.)<br>
  <strong>2. Parton Showers</strong> — Initial-state and final-state QCD radiation<br>
  <strong>3. Multiple Parton Interactions (MPI)</strong> — Additional semi-hard scatterings<br>
  <strong>4. Beam Remnants</strong> — What's left of the protons after the scattering<br>
  <strong>5. String Fragmentation</strong> — Lund string model for hadronization<br>
  <strong>6. Particle Decays</strong> — Unstable particles decay to stable final states
</div>

<h3>Using PYTHIA8 in C++</h3>
<div class="code-block"><pre>
// pythia_pp_jets.cc — Generate p+p events at 200 GeV
#include "Pythia8/Pythia.h"
using namespace Pythia8;

int main() {
  Pythia pythia;

  // Configure for RHIC p+p at 200 GeV
  pythia.readString("Beams:idA = 2212");    // proton
  pythia.readString("Beams:idB = 2212");    // proton
  pythia.readString("Beams:eCM = 200.");    // sqrt(s)

  // Enable hard QCD processes (jet production)
  pythia.readString("HardQCD:all = on");
  pythia.readString("PhaseSpace:pTHatMin = 10.");

  // Tune for RHIC energy (Monash 2013 tune)
  pythia.readString("Tune:pp = 14");

  pythia.init();

  // Event loop
  int nEvent = 10000;
  for (int iEvent = 0; iEvent < nEvent; iEvent++) {
    if (!pythia.next()) continue;

    // Loop over final-state particles
    for (int i = 0; i < pythia.event.size(); i++) {
      if (!pythia.event[i].isFinal()) continue;

      double pt  = pythia.event[i].pT();
      double eta = pythia.event[i].eta();
      double phi = pythia.event[i].phi();
      int pid    = pythia.event[i].id();

      // sPHENIX acceptance: |eta| < 1.1
      if (std::abs(eta) > 1.1) continue;

      // Fill your histograms, write to HepMC, etc.
    }
  }

  pythia.stat();  // Print cross-section info
  return 0;
}</pre></div>

<h3>PYTHIA with Python (pythia8)</h3>

# pythia_example.py — Quick PYTHIA analysis
import pythia8
import numpy as np

pythia = pythia8.Pythia()
pythia.readString("Beams:eCM = 200.")
pythia.readString("SoftQCD:all = on")
pythia.init()

pt_list = []
for iEvent in range(5000):
    if not pythia.next(): continue
    for i in range(pythia.event.size()):
        p = pythia.event[i]
        if not p.isFinal(): continue
        if abs(p.eta()) > 1.1: continue
        if p.isCharged():
            pt_list.append(p.pT())

pt_arr = np.array(pt_list)
print(f"Mean pT: {pt_arr.mean():.3f} GeV/c")

<h2>Event Generators: HIJING</h2>

<div class="concept-box">
  <strong>HIJING</strong> (Heavy Ion Jet INteraction Generator) is the workhorse event generator for heavy-ion collisions at RHIC. It models Au+Au collisions by combining the Glauber model of nuclear geometry with PYTHIA-like hard scatterings, jet quenching, and soft particle production. For sPHENIX Au+Au analyses, HIJING is typically the primary event generator.
</div>

<h3>How HIJING Models Au+Au Collisions</h3>
<div class="reading-box">
  <strong>HIJING physics components:</strong><br><br>
  <strong>1. Nuclear Geometry (Glauber Model)</strong><br>
  &nbsp;&nbsp;&nbsp;• Sample impact parameter b from 0 to ~2R_Au<br>
  &nbsp;&nbsp;&nbsp;• Determine N_part (participating nucleons) and N_coll (binary collisions)<br>
  &nbsp;&nbsp;&nbsp;• Central Au+Au: b ≈ 0, N_part ≈ 394, N_coll ≈ 1050<br><br>
  <strong>2. Hard Scatterings</strong><br>
  &nbsp;&nbsp;&nbsp;• Multiple independent nucleon-nucleon collisions<br>
  &nbsp;&nbsp;&nbsp;• Each uses PYTHIA-like hard process + parton shower<br>
  &nbsp;&nbsp;&nbsp;• Nuclear parton distributions (shadowing, EMC effect)<br><br>
  <strong>3. Jet Quenching</strong><br>
  &nbsp;&nbsp;&nbsp;• Parton energy loss in the QGP medium<br>
  &nbsp;&nbsp;&nbsp;• Radiative energy loss (gluon bremsstrahlung)<br>
  &nbsp;&nbsp;&nbsp;• Controls the R_AA suppression pattern<br><br>
  <strong>4. Soft Particle Production</strong><br>
  &nbsp;&nbsp;&nbsp;• Wounded nucleon model + string excitation<br>
  &nbsp;&nbsp;&nbsp;• Produces the bulk of dN/deta ~ 700 in central Au+Au
</div>

<h3>Using HIJING</h3>
<div class="code-block"><pre>
// HIJING is typically called via Fortran interface
// or through the Fun4All framework at sPHENIX

// In Fun4All macro (the sPHENIX way):
// Fun4All_G4_sPHENIX.C

#include &lt;fun4all/Fun4AllDstOutputManager.h&gt;
#include &lt;g4main/PHG4Reco.h&gt;
#include &lt;g4main/HepMCNodeReader.h&gt;
#include &lt;phhepmc/Fun4AllHepMCInputManager.h&gt;

// HIJING event generator setup
void setup_hijing(Fun4AllServer* se)
{
  // Use the HepMC interface
  auto* in = new Fun4AllHepMCInputManager("HIJING");
  in->fileopen("hijing_auau200_0-10.hepmc");
  se->registerInputManager(in);

  // Read HepMC events into Fun4All
  auto* reader = new HepMCNodeReader();
  se->registerSubsystem(reader);
}</pre></div>

<h3>HIJING Configuration for sPHENIX</h3>
<div class="code-block"><pre>
# HIJING input card (hijing.input)
# Au+Au collisions at 200 GeV
#
# Frame and energy
'frame'  'CMS'
'proj'   'A'    197  79    # Gold (A=197, Z=79)

<h3>Centrality Determination</h3>
<div class="code-block"><pre>
// Centrality classes from impact parameter
// (Glauber model mapping)
//
// Centrality    b (fm)     N_part   N_coll
// 0-5%          0-3.3       351     1065
// 5-10%         3.3-4.7     299      845
// 10-20%        4.7-6.6     234      603
// 20-40%        6.6-9.4     140      296
// 40-60%        9.4-11.6     59       94
// 60-80%        11.6-13.4    16       17
//
// In sPHENIX, centrality is determined from
// the MBD (Minimum Bias Detector) charge sum,
// calibrated against Glauber MC simulation.

// Python: quick Glauber-like visualization
import numpy as np
import matplotlib.pyplot as plt

# Simple wood-saxon positions for Au nuclei
R0, a = 6.38, 0.535  # fm
def wood_saxon_r():
    while True:
        r = np.random.uniform(0, 15)
        rho = 1.0 / (1 + np.exp((r - R0) / a))
        if np.random.uniform() < rho * r**2:
            return r

# Generate nucleon positions
def generate_nucleus(A=197):
    positions = []
    for _ in range(A):
        r = wood_saxon_r()
        theta = np.arccos(2*np.random.random()-1)
        phi = 2*np.pi*np.random.random()
        x = r*np.sin(theta)*np.cos(phi)
        y = r*np.sin(theta)*np.sin(phi)
        positions.append((x, y))
    return np.array(positions)</pre></div>

<div class="reading-box">
  <strong>Comparison of heavy-ion generators:</strong><br><br>

  <strong>EPOS</strong> — Parton-based Gribov-Regge theory. Good for bulk properties and flow at LHC.<br>

  <strong>Shielding</strong> — FTFP_BERT_HP + heavy ion physics. For radiation transport studies.<br><br>

<h3>Electromagnetic vs Hadronic Processes</h3>
<div class="code-block"><pre>
// Understanding what each process does:

// === ELECTROMAGNETIC (well understood, ~1% accuracy) ===
// Electrons/positrons:
//   - Ionization (energy loss in material)
//   - Bremsstrahlung (photon radiation)
//   - Multiple scattering (direction changes)
//   - Annihilation (e+e- -> gamma gamma)
//
// Photons:
//   - Photoelectric effect (absorbs photon)
//   - Compton scattering (photon + electron)
//   - Pair production (gamma -> e+e-)
//
// EMCal shower: photon/electron enters tungsten,
//   produces e+e- pairs and bremsstrahlung gammas
//   -> exponential multiplication -> shower
//   Shower depth ~ X0 * ln(E/Ec)
//   sPHENIX EMCal: ~18 X0 radiation lengths

// === HADRONIC (complex, ~5-10% accuracy) ===
// Pions, protons, neutrons, kaons:
//   - Elastic scattering
//   - Inelastic scattering (particle production)
//   - Nuclear capture
//   - Fission
//
// HCal shower: hadron hits steel nuclei,
//   produces secondary pions, protons, neutrons
//   -> hadronic cascade -> ~30% invisible energy
//   sPHENIX HCal: ~5.5 lambda_int (inner+outer)</pre></div>

<div class="concept-box">

<div class="code-block"><pre>
// EMCalSensitiveDetector.hh
#include "G4VSensitiveDetector.hh"
#include "G4THitsCollection.hh"
#include "EMCalHit.hh"

class EMCalSensitiveDetector
  : public G4VSensitiveDetector
{
public:
  EMCalSensitiveDetector(const G4String& name);

  void Initialize(G4HCofThisEvent* hce) override;
  G4bool ProcessHits(
    G4Step* step, G4TouchableHistory*) override;
  void EndOfEvent(G4HCofThisEvent* hce) override;

private:
  G4THitsCollection<EMCalHit>* fHitsCollection;
};

// EMCalHit.hh — What information to store
class EMCalHit : public G4VHit
{
public:
  void SetEdep(G4double de) { fEdep = de; }
  void SetPos(G4ThreeVector p) { fPos = p; }
  void SetTowerID(G4int id) { fTowerID = id; }
  void SetTime(G4double t) { fTime = t; }

  G4double GetEdep() const { return fEdep; }
  G4ThreeVector GetPos() const { return fPos; }
  G4int GetTowerID() const { return fTowerID; }
  G4double GetTime() const { return fTime; }

private:
  G4double fEdep = 0.;
  G4ThreeVector fPos;
  G4int fTowerID = -1;
  G4double fTime = 0.;
};</pre></div>

<h3>Processing Hits — The Step</h3>
<div class="code-block"><pre>
// EMCalSensitiveDetector.cc

G4bool EMCalSensitiveDetector::ProcessHits(
  G4Step* step, G4TouchableHistory*)
{
  // Get energy deposited in this step
  G4double edep = step->GetTotalEnergyDeposit();
  if (edep == 0.) return false;  // Skip no-deposit

  // Get position of the energy deposit
  G4ThreeVector pos =
    step->GetPreStepPoint()->GetPosition();

  // Get the tower ID from the volume copy number
  const G4VTouchable* touch =
    step->GetPreStepPoint()->GetTouchable();
  G4int towerID = touch->GetCopyNumber();

  // Get timing
  G4double time =
    step->GetPreStepPoint()->GetGlobalTime();

  // Get particle info (for truth matching)
  G4int trackID =
    step->GetTrack()->GetTrackID();
  G4int parentID =
    step->GetTrack()->GetParentID();
  G4int pdg =
    step->GetTrack()->GetDefinition()->GetPDGEncoding();

  // Create a hit and add to collection
  auto* hit = new EMCalHit();
  hit->SetEdep(edep);
  hit->SetPos(pos);
  hit->SetTowerID(towerID);
  hit->SetTime(time);
  fHitsCollection->insert(hit);

  return true;
}</pre></div>

<div class="concept-box">

<h3>Fun4All Simulation Macro</h3>
<div class="code-block"><pre>
// Fun4All_G4_sPHENIX.C — Standard sPHENIX sim macro
#include &lt;fun4all/Fun4AllServer.h&gt;
#include &lt;fun4all/Fun4AllDstOutputManager.h&gt;
#include &lt;g4main/PHG4Reco.h&gt;
#include &lt;g4main/PHG4TruthSubsystem.h&gt;
#include &lt;g4detectors/PHG4CylinderSubsystem.h&gt;

R__LOAD_LIBRARY(libfun4all.so)
R__LOAD_LIBRARY(libg4detectors.so)
R__LOAD_LIBRARY(libPHPythia8.so)

void Fun4All_G4_sPHENIX(
  int nEvents = 100,
  const char* generator = "PYTHIA8")
{
  Fun4AllServer* se = Fun4AllServer::instance();
  se->Verbosity(0);

  // --- Event Generator ---
  if (strcmp(generator, "PYTHIA8") == 0)
  {
    auto* pythia8 = new PHPythia8();
    pythia8->set_config_file("pythia8_pp200.cfg");
    se->registerSubsystem(pythia8);
  }
  else if (strcmp(generator, "HIJING") == 0)
  {
    auto* hijing =
      new Fun4AllHepMCInputManager("HIJING");
    hijing->fileopen("hijing_auau200.hepmc");
    se->registerInputManager(hijing);
    se->registerSubsystem(new HepMCNodeReader());
  }

  // --- Geant4 Setup ---
  PHG4Reco* g4Reco = new PHG4Reco();
  g4Reco->set_field_map(
    "sPHENIX.root",     // field map file
    PHFieldConfig::kFieldBeast);
  g4Reco->set_rapidity_coverage(1.1);

  // --- Detector Subsystems ---
  // MVTX (3 silicon pixel layers)
  PHG4CylinderSubsystem* mvtx;
  double mvtxR[] = {2.5, 3.3, 4.1};  // cm
  for (int i = 0; i < 3; i++) {
    mvtx = new PHG4CylinderSubsystem("MVTX", i);
    mvtx->set_double_param("radius", mvtxR[i]);
    mvtx->set_double_param("thickness", 0.005);
    mvtx->set_string_param("material", "G4_Si");
    mvtx->set_double_param("length", 27.0);
    mvtx->SetActive();
    g4Reco->registerSubsystem(mvtx);
  }

  // INTT (2 silicon strip layers)
  // TPC (drift chamber)
  // EMCal, inner HCal, outer HCal
  // ... (each configured similarly)

  // Register Geant4
  se->registerSubsystem(g4Reco);

  // Truth information
  se->registerSubsystem(new PHG4TruthSubsystem());

  // --- Output ---
  auto* out = new Fun4AllDstOutputManager(
    "DSTOUT", "G4sPHENIX.root");
  se->registerOutputManager(out);

  // --- Run ---
  se->run(nEvents);
  se->End();
  delete se;
}</pre></div>
