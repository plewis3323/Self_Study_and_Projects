<h2>Fast Simulation with ML Surrogates</h2>

<div class="concept-box">
  <strong>The Problem:</strong> Full Geant4 simulation of central Au+Au events in sPHENIX takes ~30 seconds per event. For a typical analysis campaign requiring 100 million events, that is ~95 years of single-core CPU time. Fast simulation using ML surrogate models can speed this up by 100-1000x while maintaining reasonable accuracy.
</div>

<h3>Fast Simulation Approaches</h3>
<div class="reading-box">
  <strong>Hierarchy of simulation speed vs accuracy:</strong><br><br>
  <strong>Full Geant4</strong> — Most accurate, slowest (~30s/event for Au+Au)<br>
  <strong>Parameterized Fast Sim</strong> — Replace showers with parameterized response (~0.1s/event)<br>
  <strong>ML Surrogate (GAN/VAE)</strong> — Learn the shower shape from full sim (~0.001s/event)<br>
  <strong>Smearing</strong> — Apply resolution functions to truth (~0.0001s/event)
</div>

<h3>GAN-Based Calorimeter Simulation</h3>
<div class="code-block"><pre>
# CaloGAN — Generate EMCal shower images with a GAN
import torch
import torch.nn as nn

class CaloGenerator(nn.Module):
    """Generate 3D calorimeter shower images"""
    def __init__(self, latent_dim=128):
        super().__init__()
        self.latent_dim = latent_dim

        # Condition on particle type and energy
        self.condition_embed = nn.Sequential(
            nn.Linear(2, 64),  # [pdg_onehot, energy]
            nn.LeakyReLU(0.2)
        )

        self.main = nn.Sequential(
            # Input: latent + condition -> feature maps
            nn.Linear(latent_dim + 64, 512 * 4 * 4),
            nn.BatchNorm1d(512 * 4 * 4),
            nn.LeakyReLU(0.2),

            # Reshape to 3D and upsample
            nn.Unflatten(1, (512, 4, 4)),
            nn.ConvTranspose2d(512, 256, 4, 2, 1),
            nn.BatchNorm2d(256),
            nn.LeakyReLU(0.2),

            nn.ConvTranspose2d(256, 128, 4, 2, 1),
            nn.BatchNorm2d(128),
            nn.LeakyReLU(0.2),

            nn.ConvTranspose2d(128, 1, 4, 2, 1),
            nn.ReLU()  # Energy deposits are positive
        )

    def forward(self, z, condition):
        c = self.condition_embed(condition)
        x = torch.cat([z, c], dim=1)
        return self.main(x)

# Training: full Geant4 showers as ground truth
# Inference: generate showers in milliseconds</pre></div>

<h3>Normalizing Flows for Detector Response</h3>
<div class="code-block"><pre>
# Use normalizing flows to learn the mapping:
# truth particle -> detector response
import torch
from torch import nn

class DetectorFlow(nn.Module):
    """Learn p(response | truth) as a flow"""
    def __init__(self):
        super().__init__()
        # Condition on truth kinematics
        self.context_net = nn.Sequential(
            nn.Linear(4, 128),   # [pT, eta, phi, pid]
            nn.ReLU(),
            nn.Linear(128, 128)
        )
        # Flow transforms
        self.flows = nn.ModuleList([
            AffineTransform(dim=32, context_dim=128)
            for _ in range(8)
        ])

    def sample(self, truth_kinematics, n_samples=1):
        """Generate detector response given truth"""
        context = self.context_net(truth_kinematics)
        z = torch.randn(n_samples, 32)
        for flow in self.flows:
            z = flow(z, context)
        return z  # Detector-level features

# Applications at sPHENIX:
# - EMCal energy response: E_reco / E_truth
# - Track pT resolution: sigma(pT) / pT
# - Tower-level shower shapes</pre></div>

<h3>Validation: Fast Sim vs Full Sim</h3>
<div class="code-block"><pre>
# Always validate fast sim against full Geant4!
import numpy as np

def validate_fast_sim(full_sim, fast_sim):
    """Compare distributions between full and fast sim"""
    metrics = {}

    # 1. Energy resolution
    E_ratio_full = full_sim['E_reco'] / full_sim['E_truth']
    E_ratio_fast = fast_sim['E_reco'] / fast_sim['E_truth']
    metrics['mean_bias'] = (
      np.mean(E_ratio_fast) - np.mean(E_ratio_full))
    metrics['resolution_diff'] = (
      np.std(E_ratio_fast) - np.std(E_ratio_full))

    # 2. Shower shape (lateral spread)
    metrics['shower_width_diff'] = (
      np.mean(fast_sim['shower_sigma_r'])
      - np.mean(full_sim['shower_sigma_r']))

    # 3. Kolmogorov-Smirnov test
    from scipy.stats import ks_2samp
    ks_stat, p_value = ks_2samp(
      E_ratio_full, E_ratio_fast)
    metrics['ks_pvalue'] = p_value

    # Goal: bias < 1%, resolution within 5%,
    #        KS p-value > 0.05
    return metrics</pre></div>

#include "g4main/PHG4VtxPoint.h"

int MyAnalysis::process_event(PHCompositeNode* topNode)

  // Get truth container
  auto* truthInfo = findNode::getClass
    <PHG4TruthInfoContainer>(topNode,

  // Loop over primary particles

    truthInfo->GetPrimaryParticleRange();

       it != range.second; ++it)
  {

    int pid = part->get_pid();
    double px = part->get_px();
    double py = part->get_py();
    double pz = part->get_pz();

<h3>Tracking Efficiency from Simulation</h3>
<div class="code-block"><pre>
# Compute tracking efficiency using truth matching
def tracking_efficiency(sim_tree):
    """
    Efficiency = N(matched reco tracks) /
                 N(truth primary charged particles)
    """
    pt_bins = np.linspace(0, 10, 50)
    n_truth = np.zeros(len(pt_bins)-1)
    n_matched = np.zeros(len(pt_bins)-1)

    for event in sim_tree:
        # Truth primary charged particles
        truth_pt = event['truth_pt']
        truth_charge = event['truth_charge']
        truth_eta = event['truth_eta']

        # Acceptance cuts
        mask = ((np.abs(truth_eta) < 1.1) &
                (truth_charge != 0))
        truth_accepted = truth_pt[mask]

        # Matched reconstructed tracks
        reco_pt = event['matched_reco_pt']
        reco_eta = event['matched_reco_eta']
        reco_mask = np.abs(reco_eta) < 1.1
        reco_matched = reco_pt[reco_mask]

        n_truth += np.histogram(
          truth_accepted, bins=pt_bins)[0]
        n_matched += np.histogram(
          reco_matched, bins=pt_bins)[0]

    eff = np.divide(n_matched, n_truth,
      where=n_truth > 0)
    eff_err = np.sqrt(eff * (1-eff) /
      np.maximum(n_truth, 1))

    return pt_bins, eff, eff_err</pre></div>
